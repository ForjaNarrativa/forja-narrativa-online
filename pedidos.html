<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Meus Pedidos | Forja Narrativa</title>

  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/pedidos.css" />

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="noise"></div>
  <div class="embers" id="embers"></div>

  <header class="topbar">
    <div class="brand">
      <div class="logo">F</div>
      <div>
        <h1>Meus Pedidos</h1>
        <p>Acompanhe suas criações</p>
      </div>
    </div>

    <nav id="mainNav"></nav>
  </header>

  <main class="ordersClientMain">
    <section class="ordersClientHero">
      <span class="tag">Área do cliente</span>

      <h2>
        Suas criações
        <strong>em andamento.</strong>
      </h2>

      <p>
        Aqui ficam todos os pedidos enviados pela sua conta.
      </p>
    </section>

    <section class="ordersClientArea">
      <div id="clientOrdersLoading" class="clientOrdersLoading">
        Carregando seus pedidos...
      </div>

      <div id="clientOrdersList" class="clientOrdersList"></div>
    </section>
  </main>

  <footer>
    <p>Forja Narrativa © 2026 — Cada criação deixa uma marca.</p>
  </footer>

  <script src="js/supabase.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/pedidos.js"></script>
</body>
</html>
